name: Generate professional snake animation (Black and White)

on:
  schedule:
    # Führe alle 6 Stunden aus, um die Statistiken aktuell zu halten
    - cron: "* */6 * * *"
  workflow_dispatch:
  push:
    branches:
    - master
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: generate snake.svg
        # Benutze die modernste Version von snk für Farbpaletten
        uses: Platane/snk@v2.0.1
        with:
          github_user_name: ${{ github.repository_owner }}
          # Konfiguriere die Farbpalette für ein professionelles s/w-Thema
          outputs: |
            dist/snake.svg?color_snake=%23333333&color_dot=%23EEEEEE&color_dot_special=%23FFFFFF&color_head=%23000000

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
